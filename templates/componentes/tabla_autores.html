{% from "componentes/fila_autor.html" import fila_autor %}

{% macro tabla_autores(autores) %}
<div class="card" id="tabla-autores">
    <div class="card-body">
        <h5 class="card-title">Lista de autores</h5>
        <table class="table table-striped align-middle">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>País</th>
                    <th>Nacimiento</th>
                    <th class="text-end">Acciones</th>
                </tr>
            </thead>
            <tbody>
                {% for autor in autores %}
                {{ fila_autor(autor) }}
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endmacro %}
